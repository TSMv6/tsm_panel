# popsim_run_HH.toml (HH run) -- generated by the TSM PopulationSIM dialog.
# C:/TSM_NextGen_v6/Base/TSMv6_2024 and 24 are filled in at run time. Seed/crosswalk/controls
# are user-maintained inputs under <scenario>/popsim_seed/.

[runtime]
threads       = 24      # 0 = hardware_concurrency
log_level     = "info"
profile       = "HH"
hh_flag       = 1
total_control = "num_hh"

[paths]
seed_households = "C:/TSM_NextGen_v6/Inputs/popsim_seed/seed_hh_prepped.csv"
seed_persons    = "C:/TSM_NextGen_v6/Inputs/popsim_seed/seed_persons_Y5_2022_1D_NAICS_OCC.csv"
se_data         = "C:/TSM_NextGen_v6/Base/TSMv6_2024/tsm_landuse.csv"
geo_crosswalk   = "C:/TSM_NextGen_v6/Inputs/popsim_seed/TSM_geo_Crosswalk.csv"
controls        = "C:/TSM_NextGen_v6/Inputs/popsim_seed/controls_HH_with_pop.csv"
output_dir      = "C:/TSM_NextGen_v6/Base/TSMv6_2024/HH"

weight_column   = "WGTP"
hh_id_column    = "hh_id"
puma_column     = "PUMA"

[balancer]
max_iterations  = 2000
convergence_tol = 1.0e-6
gamma_lb        = 1.0e-6
gamma_ub        = 1.0e6

[integerizer]
lp_timeout_ms   = 60000
