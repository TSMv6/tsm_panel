# popsim_run_HH.toml (HH run) -- generated by the TSM PopulationSIM dialog.
# C:/TSM_NextGen_v6/Base/TSMv6_2024, C:/TSM_NextGen_v6, C:/Users/kn815vs/AppData/Roaming/QGIS/QGIS3/profiles/default/python/plugins/tsm_panel and 40 are filled in at run time.
# Large seeds/crosswalk live under C:/TSM_NextGen_v6/Inputs/popsim_seed; the popsim
# CONTROLS ship inside the plugin at C:/Users/kn815vs/AppData/Roaming/QGIS/QGIS3/profiles/default/python/plugins/tsm_panel/config/popsim. se_data (aggregated
# to TSM by se_aggregate) and output are per-scenario.
# controls_with_age.csv enforces person age/sex marginals (needs seed_hh_with_age.csv).

[runtime]
threads       = 40      # 0 = hardware_concurrency
log_level     = "info"
profile       = "HH"
hh_flag       = 1
total_control = "num_hh"

[paths]
seed_households = "C:/TSM_NextGen_v6/Inputs/popsim_seed/seed_hh_with_age.csv"
seed_persons    = "C:/TSM_NextGen_v6/Inputs/popsim_seed/seed_persons_Y5_2022_1D_NAICS_OCC.csv"
se_data         = "C:/TSM_NextGen_v6/Base/TSMv6_2024/tsm_landuse.csv"
geo_crosswalk   = "C:/TSM_NextGen_v6/Inputs/popsim_seed/TSM_geo_Crosswalk.csv"
controls        = "C:/Users/kn815vs/AppData/Roaming/QGIS/QGIS3/profiles/default/python/plugins/tsm_panel/config/popsim/controls_with_age.csv"
output_dir      = "C:/TSM_NextGen_v6/Base/TSMv6_2024/HH"

weight_column   = "WGTP"
hh_id_column    = "hh_id"
puma_column     = "PUMA"

[balancer]
max_iterations  = 2000
convergence_tol = 1.0e-6
gamma_lb        = 1.0e-6
gamma_ub        = 1.0e6

[integerizer]
lp_timeout_ms   = 60000
