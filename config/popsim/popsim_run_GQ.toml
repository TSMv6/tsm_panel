# popsim_run_GQ.toml (Group Quarters run) -- generated by the TSM PopulationSIM dialog.
# C:/TSM_NextGen_v6/Base/TSMv6_2024, C:/TSM_NextGen_v6, C:/Users/kn815vs/AppData/Roaming/QGIS/QGIS3/profiles/default/python/plugins/tsm_panel and 24 are filled in at run time.
# Large seeds/crosswalk live under C:/TSM_NextGen_v6/Inputs/popsim_seed; the popsim
# CONTROLS ship inside the plugin at C:/Users/kn815vs/AppData/Roaming/QGIS/QGIS3/profiles/default/python/plugins/tsm_panel/config/popsim. se_data (aggregated
# to TSM by se_aggregate) and output are per-scenario.

[runtime]
threads       = 24      # 0 = hardware_concurrency
log_level     = "info"
profile       = "GQ"
hh_flag       = 0
total_control = "num_gq"

[paths]
seed_households = "C:/TSM_NextGen_v6/Inputs/popsim_seed/seed_gq_prepped.csv"
seed_persons    = "C:/TSM_NextGen_v6/Inputs/popsim_seed/seed_persons_GQ_Y5_2022_1D_NAICS_OCC.csv"
se_data         = "C:/TSM_NextGen_v6/Base/TSMv6_2024/tsm_landuse.csv"
geo_crosswalk   = "C:/TSM_NextGen_v6/Inputs/popsim_seed/TSM_GQ_geo_Crosswalk.csv"
controls        = "C:/Users/kn815vs/AppData/Roaming/QGIS/QGIS3/profiles/default/python/plugins/tsm_panel/config/popsim/controls_GQ.csv"
output_dir      = "C:/TSM_NextGen_v6/Base/TSMv6_2024/GQ"

weight_column   = "GQWGTP"
hh_id_column    = "hh_id"
puma_column     = "PUMA"

[balancer]
max_iterations  = 2000
convergence_tol = 1.0e-6
gamma_lb        = 1.0e-6
gamma_ub        = 1.0e6

[integerizer]
lp_timeout_ms   = 60000
