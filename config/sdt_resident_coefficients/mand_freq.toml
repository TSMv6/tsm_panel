  { id=52, label="no_cars_work",            value=-0.141108118424 },
  { id=53, label="low_income_work",         value=-1.09661458294 },
  { id=54, label="med_income_work",         value=-0.661860926112 },
  { id=55, label="emp_density",             value=-5.09552766863e-06 },
  # Female conditional on FT/PT: Java (female*fullTime*workTours==1) and (female*partTime*workTours==1)
