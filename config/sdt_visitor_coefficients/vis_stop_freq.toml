# SDT Model — vis_stop_freq visitor coefficients
# MNL 0-3 stops per half-tour; applied independently to outbound and inbound.
# Calibrated from Java visitorTours.csv empirical stop frequency distribution.
#
# Reference alternative: 0 stops (constant=0.0)
# party_size coefficient removed (was placeholder; not in Java UEC)
#
# Calibrated ASCs (vs 0-stop reference):
#   1 stop: -1.34
#   2 stops: -2.48
#   3 stops: -3.65

[vis_stop_freq]
model_name  = "vis_stop_freq"
description = "MNL 0-3 stops per half-tour; calibrated from Java visitorTours.csv"
version     = "2.0"

[[vis_stop_freq.alternatives]]
alt     = 0
purpose = -1
segment = -1
coefficients = [{id=1, label="constant", value=0.0}]

[[vis_stop_freq.alternatives]]
alt     = 1
purpose = -1
segment = -1
coefficients = [{id=1, label="constant", value=-1.34}]

[[vis_stop_freq.alternatives]]
alt     = 2
purpose = -1
segment = -1
coefficients = [{id=1, label="constant", value=-2.48}]

[[vis_stop_freq.alternatives]]
alt     = 3
purpose = -1
segment = -1
coefficients = [{id=1, label="constant", value=-3.65}]
