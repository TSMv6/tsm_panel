# HyDRA link-performance summary (template). The plugin fills the @...@
# placeholders at run time. mode="hydra" streams the per-interval
# link_performance CSVs (macroDTA required; mesoDTA / microDTA optional --
# their links are disjoint sets, all stream into the same daily accumulator),
# folds simulation overflow hours (24..29) into 0..5, and writes the loaded
# daily CSV + GPKG with VOL_/SPD_/QUE_ hourly columns.
name = "loaded"
mode = "hydra"
group_by = ["A", "B"]

[input]
path = "@VOL@"
rename = ["a_node=A", "b_node=B"]
@INPUT2@
@INPUT3@
[join]
path = "@LINK@"
rename = [@RENAME@]

# Node balancing (on by default): hourly volumes are adjusted by the smallest
# volume-proportional amount that makes in = out at every non-centroid node
# each hour; VOL_hh, VOL_DAILY, VMT, VHT, VHD, MAX_VOL and PUR_ use the
# balanced volumes. log_csv = true also writes <out>_balance.csv (raw ->
# balanced per link-hour, ~600 MB statewide) + <out>_balance_summary.csv.
[balance]
enabled = true
log_csv = false
centroid_fname = "Centroid_Conn"

[output]
csv = "@OUT_CSV@"
gpkg = "@OUT_GPKG@"
