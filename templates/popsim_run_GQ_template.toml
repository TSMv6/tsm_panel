# popsim_run_GQ.toml (Group Quarters run) -- generated by the TSM PopulationSIM dialog.
# The PopSyn dialog fills the scenario folder, TSM root, plugin folder, land use
# (se_data) and thread count below. Large seeds and the crosswalk live under the
# TSM root's Inputs/popsim_seed; the popsim controls ship with the plugin in
# config/popsim. Outputs go to the scenario folder with a HH_/GQ_ prefix.

[runtime]
threads       = {threads}      # 0 = hardware_concurrency
log_level     = "info"
profile       = "GQ"
hh_flag       = 0
total_control = "num_gq"

[paths]
seed_households = "{tsm_location}/Inputs/popsim_seed/seed_gq_prepped.csv"
seed_persons    = "{tsm_location}/Inputs/popsim_seed/seed_persons_GQ_Y5_2022_1D_NAICS_OCC.csv"
se_data         = "{se_data}"
geo_crosswalk   = "{tsm_location}/Inputs/popsim_seed/PopSyn_geo_Crosswalk.csv"
controls        = "{plugin_dir}/config/popsim/controls_GQ.csv"
output_dir      = "{scenario_dir}"
output_prefix   = "GQ_"

weight_column   = "GQWGTP"
hh_id_column    = "hh_id"
puma_column     = "PUMA"

[balancer]
max_iterations  = 2000
convergence_tol = 1.0e-6
gamma_lb        = 1.0e-6
gamma_ub        = 1.0e6

[integerizer]
lp_timeout_ms   = 60000
