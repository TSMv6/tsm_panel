# popsim_run_GQ.toml (Group Quarters run) -- generated by the TSM PopulationSIM dialog.
# {scenario_dir}, {tsm_location} and {threads} are filled in at run time.
# Shared seeds/crosswalk/controls live under {tsm_location}/Inputs/popsim_seed;
# se_data (aggregated to TSM by se_aggregate) and output are per-scenario.

[runtime]
threads       = {threads}      # 0 = hardware_concurrency
log_level     = "info"
profile       = "GQ"
hh_flag       = 0
total_control = "num_gq"

[paths]
seed_households = "{tsm_location}/Inputs/popsim_seed/seed_gq_prepped.csv"
seed_persons    = "{tsm_location}/Inputs/popsim_seed/seed_persons_GQ_Y5_2022_1D_NAICS_OCC.csv"
se_data         = "{scenario_dir}/tsm_landuse.csv"
geo_crosswalk   = "{tsm_location}/Inputs/popsim_seed/TSM_GQ_geo_Crosswalk.csv"
controls        = "{tsm_location}/Inputs/popsim_seed/controls_GQ.csv"
output_dir      = "{scenario_dir}/GQ"

weight_column   = "GQWGTP"
hh_id_column    = "hh_id"
puma_column     = "PUMA"

[balancer]
max_iterations  = 2000
convergence_tol = 1.0e-6
gamma_lb        = 1.0e-6
gamma_ub        = 1.0e6

[integerizer]
lp_timeout_ms   = 60000
