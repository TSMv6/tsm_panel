# Select-link loaded volume (single volume file). One total column (SL_VOL); no
# pivots/metrics. Plugin fills @...@ at run time.
name = "selectlink"
group_by = ["A", "B"]
# Both select-link producers emit a single weighted total, not wide per-class
# columns: afdta --select-link writes a_node,b_node,resolved,used_weight,...
# and agentAnalysis "agents --volumes" writes a_node,b_node,agents,veh_weight.
# Missing sum_cols are ignored by summarize, so listing market segments here
# silently produced a zero total.
sum_cols = ["veh_weight", "used_weight"]
total_col = "SL_VOL"
emit_class_sums = false

[input]
format = "csv"
path = "@VOL@"
rename = ["a_node=A", "b_node=B"]

[join]
format = "gpkg"
path = "@LINK@"
rename = [@RENAME@]

[output]
csv = "@OUT_CSV@"
gpkg = "@OUT_GPKG@"
