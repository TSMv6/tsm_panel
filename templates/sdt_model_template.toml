# SDT Model run configuration -- generated by the TSM SDT dialogs.
# Placeholders ({...}) are filled at run time. Coefficient/parameter dirs stay
# relative to project_dir (the config folder); scenario files are absolute.

[runtime]
mode        = "desktop"
threads     = {threads}
sample_rate = 1.0
sample_seed = 198761
iteration   = 1
log_level   = "info"

[paths]
project_dir               = "{project_dir}"
synthetic_households      = "{syn_hh}"
synthetic_persons         = "{syn_per}"
taz_data                  = "{tsm_landuse}"
output_dir                = "{output_dir}"
resident_coefficients_dir = "config/sdt_resident_coefficients"
visitor_coefficients_dir  = "config/sdt_visitor_coefficients"
stop_frequency_dist       = "config/sdt_parameters/ResidentStopFrequencyDistributions.csv"
tour_tod_dist             = "config/sdt_parameters/ResidentTourTimeOfDayDistributions_revised.csv"
stop_purpose_dist         = "config/sdt_parameters/ResidentStopPurposeDistributions.csv"
stop_tod_outbound_dist    = "config/sdt_parameters/ResidentOutboundStopDurationDistributions.csv"
stop_tod_inbound_dist     = "config/sdt_parameters/ResidentInboundStopDurationDistributions.csv"
vehicle_type_alts          = "{tsm_location}/Inputs/vehTypeChoice/ResidentVehicleTypeAlts.csv"
visitor_vehicle_type_alts  = "{tsm_location}/Inputs/vehTypeChoice/VisitorVehicleTypeAlts.csv"
visitor_tour_tod_dist      = "config/sdt_parameters/VisitorTourTimeOfDayDistributions_revised.csv"
visitor_params_dir         = "config/sdt_parameters"
visitor_tour_freq_business = "config/sdt_parameters/VisitorTourFrequencyDistributionBusiness.csv"
visitor_tour_freq_personal = "config/sdt_parameters/VisitorTourFrequencyDistributionPersonal.csv"
visitor_hotel_party_size   = "config/sdt_parameters/HotelVisitorPartySizeFrequencyDistributionsPerDistrict.csv"
visitor_vr_party_size      = "config/sdt_parameters/VacationRentalVisitorPartySizeFrequencyDistributionsPerDistrict.csv"
visitor_house_party_size   = "config/sdt_parameters/HouseVisitorPartySizeFrequencyDistributionsPerDistrict.csv"

[skims]
tile_path       = ""
tile_size       = 0
distance_file   = "{skim}"
distance_matrix = "DISTANCE"
time_matrix     = "TIME"
cost_matrix     = "TOLL"
auto_skim_ea    = "{skim}"
auto_skim_am    = "{skim}"
auto_skim_md    = "{skim}"
auto_skim_pm    = "{skim}"
auto_skim_ev    = "{skim}"

[wfh]
share = {wfh_share}

[shadow_pricing]
# ON by default: shadow prices push mandatory destinations away from nearby
# oversaturated zones, which lengthens work/university trips and feeds the
# limited-access system. With it off, mandatory destinations cluster near home
# and the freeway network is starved (see the run27/28 validation report,
# "Shadow pricing shifts mandatory destinations further from home on average").
# NB: the SP loop still converges only to RMSE ~0.32 against a 0.01 target --
# it draws with an empty CoeffTable (size terms, no utility), a documented open
# bug -- so the prices are directionally right but not converged.
enabled        = true
max_iterations = 10
rmse_target    = 0.01
damp_factor    = 1.0
# Both sides are scenario-local. input_file is resolved by sdt_runner to this
# scenario's own shadowPrices (written by its previous run), falling back to the
# shipped TSMv4 seed only on a scenario's first shadow-priced run -- scenarios
# must not inherit each other's prices from the plugin config.
# After that first run input and output are the SAME path, so the file is
# self-updating state (the engine reads at startup and writes atomically via
# .tmp+rename at the end). Delete the scenario's shadowPrices to re-bootstrap
# from the shipped seed.
input_file     = "{shadow_input}"
output_file    = "{output_dir}/shadowPrices"

[vot]
work_ivt_mean               = -1.33
work_ivt_sd                 = 0.71
work_cost_coeff             = -7.28
nonwork_ivt_mean            = -1.52
nonwork_ivt_sd              = 0.62
nonwork_cost_coeff          = -6.45
visitor_business_ivt_mean   = -2.14
visitor_business_ivt_sd     = 0.60
visitor_business_cost_coeff = -3.71
visitor_personal_ivt_mean   = -2.11
visitor_personal_ivt_sd     = 0.60
visitor_personal_cost_coeff = -3.20
vot_threshold_low           = 6.51
vot_threshold_med           = 11.68

[costs]
cost_per_mile_fuel        = 0.1296
cost_per_mile_maintenance = 0.0704

[output]
csv             = true
duckdb          = false
parquet         = false
debug_outputs   = false
result_store    = "{output_dir}/results.duckdb"
resident_prefix = "sdt_resident"
visitor_prefix  = "sdt_visitor"

[feedback_weights]
enabled             = false
input_file          = ""
apply_trip_mode     = true
apply_stop_location = true
apply_tour_dest     = true

[incremental]
enabled             = false
dirty_zones_file    = ""
new_households_file = ""

[models]
run_resident_model              = {run_resident}
run_work_from_home              = {run_wfh}
run_mandatory_models            = {run_mandatory}
run_auto_ownership              = {run_auto_own}
run_vehicle_type_choice         = {run_veh_type}
run_visitor_vehicle_type_choice = {run_visitor_veh}
run_tour_models                 = {run_tour}
run_stop_models                 = {run_stop}
run_trip_models                 = {run_trip}
run_visitor_model               = {run_visitor}

[params]
work_income_breaks = [25000, 50000, 75000, 100000]

[scenario]
year = {year}

[cpi]
factor = 1.0
